<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Lyna 💙</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #6693F5, #8fb1ff);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 35px;
      border-radius: 20px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    h2 {
      margin-top: 0;
      font-weight: 400;
      opacity: 0.9;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
    }

    img {
      width: 100%;
      max-width: 260px;
      border-radius: 15px;
      margin: 20px 0;
    }

    .date {
      margin-top: 15px;
      font-size: 1rem;
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Happy Birthday 🎂</h1>
    <h2>Lyna 💙</h2>

    <!-- Friends birthday GIF -->
    <img src="https://tenor.com/bCsqI.gif" alt="Happy Birthday Friends">

    <p>
      I wish you a day full of happiness, laughter, and love ✨  
      You deserve all the beautiful things in the world 💕
    </p>

    <div class="date">
      24 / 02 / 2002 💙
    </div>
  </div>

</body>
</html>
